[package]
name = "kvs"
version = "0.1.0"
authors = ["Denis Peshkov <denpeshkov98@gmail.com>"]
description = "A key-value store"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
sled = "0.34.7"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
assert_cmd = "2.2.1"
criterion = "0.8.2"
predicates = "3.1.4"
rand = "0.10.1"
tempfile = "3.27.0"
walkdir = "2.5.0"

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }


[[bench]]
name = "engine_bench"
harness = false
