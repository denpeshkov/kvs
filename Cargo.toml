[package]
name = "kvs"
version = "0.1.0"
authors = ["Denis Peshkov <denpeshkov98@gmail.com>"]
description = "A key-value store"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"

[dev-dependencies]
assert_cmd = "2.2.1"
predicates = "3.1.4"
tempfile = "3.27.0"
walkdir = "2.5.0"

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
